[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spectrona-cli"
version = "0.1.0"
description = "Spectrona local control plane CLI"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]

[project.scripts]
spectrona = "spectrona_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
