# Secrets Risk Rules — mcp-inspector Phase 1

rules:

  - id: SECRET_HIGH_ENTROPY_VALUE
    title: High-entropy string found in config (possible secret)
    severity: high
    category: secrets
    description: >
      A config value has high Shannon entropy consistent with an API key,
      token, or password stored in plaintext.
    detection_hint: >
      Calculate Shannon entropy of string values. Flag if entropy > 4.5 and
      length >= 20 characters.
    evidence_field: config_key
    recommended_fix: Move secrets to environment variables or a secrets manager.
    confidence: medium

  - id: SECRET_KNOWN_PREFIX
    title: Value matches known secret prefix pattern
    severity: critical
    category: secrets
    description: >
      A config value begins with a known secret prefix (e.g. sk-, ghp_, ghs_,
      AKIA, xoxb-, npm_). This is almost certainly a credential.
    detection_hint: >
      Scan all string values for known prefixes: sk-, ghp_, ghs_, AKIA,
      xoxb-, xapp-, xoxp-, npm_, pat_, op_, dp-.
    evidence_field: config_key
    recommended_fix: Revoke credential immediately. Use environment variable references.
    confidence: high

  - id: SECRET_IN_GIT_HISTORY
    title: Secret-like value may be committed in git history
    severity: high
    category: secrets
    description: >
      A file containing a high-entropy or prefixed secret is tracked by git.
      Even if removed now, the secret may exist in git history.
    detection_hint: >
      Cross-reference flagged files against git-tracked files.
    evidence_field: file_path
    recommended_fix: Rotate credential. Use git-filter-repo or BFG to purge history.
    confidence: medium

  - id: SECRET_ENV_FILE_EXPOSED
    title: .env file is not in .gitignore
    severity: high
    category: secrets
    description: >
      A .env file exists in the repo but is not excluded by .gitignore.
      It may have been or could be committed.
    detection_hint: >
      Check for .env, .env.local, .env.production existence without
      corresponding .gitignore entry.
    evidence_field: file_path
    recommended_fix: Add .env* to .gitignore immediately.
    confidence: high
