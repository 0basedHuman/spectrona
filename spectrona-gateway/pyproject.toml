[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spectrona-gateway"
version = "0.1.0"
description = "Local-first AI gateway with DLP and audit logging"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.scripts]
spectrona-gateway = "spectrona_gateway.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectrona_gateway = ["ui/*.html"]
